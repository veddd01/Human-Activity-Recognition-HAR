# ============================================================================
# HAR Project — Docker Compose (Production)
# ============================================================================

services:
  streamlit:
    build: .
    container_name: har-streamlit-prod
    expose:
      - "8501"
    volumes:
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    restart: always

  api:
    build: .
    container_name: har-api-prod
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    expose:
      - "8000"
    volumes:
      - ./models:/app/models
      - har-db:/app/data
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  nginx:
    image: nginx:alpine
    container_name: har-nginx-prod
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - streamlit
      - api
    restart: always

volumes:
  har-db:
