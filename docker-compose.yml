# ============================================================================
# HAR Project — Docker Compose (Development)
# ============================================================================
# Two services sharing the same build context:
#   - streamlit : the interactive Streamlit dashboard (port 8501)
#   - api       : the FastAPI prediction backend   (port 8000)
# ============================================================================

services:
  streamlit:
    build: .
    container_name: har-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    depends_on:
      - api

  api:
    build: .
    container_name: har-api
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - har-db:/app/data
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  har-db:
