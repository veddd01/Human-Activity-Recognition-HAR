name: HAR CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify model files exist
        run: |
          echo "Checking required model files..."
          for f in logistic_regression.pkl random_forest.pkl svm.pkl xgboost.pkl lightgbm.pkl ensemble.pkl nn_model.keras cnn_lstm.keras; do
            if [ ! -f "models/$f" ]; then
              echo "ERROR: Missing model file: models/$f"
              exit 1
            fi
            echo "  ✓ models/$f"
          done
          echo "All model files present."

      - name: Run tests
        env:
          HAR_JWT_SECRET: ci-test-secret-not-for-production
          HAR_SEED_DEMO_USERS: 'true'
        run: |
          pytest tests/ -v --tb=short

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Docker Image
        run: docker build -t har-app:latest .
